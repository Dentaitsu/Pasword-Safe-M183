services:
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: passwordmanager
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d passwordmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      DB_HOST: db
      DB_NAME: passwordmanager
      DB_USER: admin
      DB_PASSWORD: secret
      ASPNETCORE_ENVIRONMENT: Development
      JWT_SECRET: dev-only-jwt-signing-secret-change-me-please-32chars
      PEPPER: dev-only-pepper-change-me
      ENCRYPTION_KEY: /kUvtIGoN4/39cRE4+Rhp8dwu4KKqT/izYo4O1qpd+Q=
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/obj
      - /app/bin
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data: